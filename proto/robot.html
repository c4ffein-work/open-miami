<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OPEN MIAMI // Robot 3D->2D pipeline proto</title>
<style>
  html,body{margin:0;background:#0b0e13;color:#cdd;font-family:monospace;}
  #wrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;}
  canvas{image-rendering:pixelated;background:#12161d;box-shadow:0 0 0 1px #2a3340;}
  .hud{font-size:12px;opacity:.7;}
  a{color:#7cc;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="384" height="384"></canvas>
  <div class="hud" id="hud"></div>
  <div class="hud">interactive editor: <a href="editor.html">editor.html</a></div>
</div>
<script type="module">
/* =========================================================================
   OPEN MIAMI - standalone 3D -> top-down -> stylized 2D sprite pipeline proto.
   All rendering now lives in the reusable ./robot-core.js module; this page
   is just the query-param driver + screenshot harness it always was.
   Query params:
     ?frame=N     integer -> deterministic animation phase (for screenshots)
     ?t=SECONDS   float   -> alternative continuous time (overrides frame)
     ?pose=idle|walk|shoot|hit
     ?color=coral|red|magenta|violet   (player + 3 rogue palettes)
     ?px=6        pixelation block size (post pass)
   If neither frame nor t given -> live animation via requestAnimationFrame.
   ========================================================================= */
import { createRenderer, PALETTES, POSES } from "./robot-core.js";

const Q = new URLSearchParams(location.search);
const POSE = (Q.get("pose") || "walk").toLowerCase();
const COLORNAME = (Q.get("color") || "coral").toLowerCase();
const PX = Math.max(1, parseInt(Q.get("px") || "5", 10));
const hasFrame = Q.has("frame");
const hasT = Q.has("t");
const FIXED = hasT ? parseFloat(Q.get("t")) : (hasFrame ? parseInt(Q.get("frame"),10) * (1/12) : null);

const hud = document.getElementById("hud");
const canvas = document.getElementById("c");

let renderer;
try {
  renderer = createRenderer(canvas);
} catch(e){
  hud.textContent = "WebGL unavailable: " + e.message;
  throw e;
}

const color = PALETTES[COLORNAME] ? COLORNAME : "coral";
const pose  = POSES.includes(POSE) ? POSE : "walk";

function label(t){ hud.textContent = `pose=${pose} color=${color} px=${PX} t=${t.toFixed(3)}`; }
function draw(t){ renderer.render({pose, color, px:PX, time:t}); }

window.__ready = false;
if(FIXED!==null){
  draw(FIXED); label(FIXED);
  window.__ready = true; // screenshot flag
} else {
  const t0 = performance.now();
  (function loop(){
    const t=(performance.now()-t0)/1000;
    draw(t); label(t);
    window.__ready = true;
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
