name: E2E Tests

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e-test:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-

      - name: Install wasm-bindgen-cli
        run: |
          # Pin wasm-bindgen-cli to the wasm-bindgen crate version in Cargo.lock:
          # the CLI and the crate must match exactly or glue generation fails.
          WASM_BINDGEN_VERSION=$(grep -A 2 'name = "wasm-bindgen"' Cargo.lock | grep '^version = ' | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Installing wasm-bindgen-cli v$WASM_BINDGEN_VERSION to match Cargo.lock"
          cargo install wasm-bindgen-cli --version $WASM_BINDGEN_VERSION

      - name: Build WASM
        run: |
          echo "Building WASM for e2e tests..."
          cargo build --release --target wasm32-unknown-unknown

      - name: Generate wasm-bindgen JavaScript glue
        run: |
          wasm-bindgen target/wasm32-unknown-unknown/release/open_miami.wasm \
            --out-dir . \
            --target web \
            --no-typescript
          ls -lh open_miami.js open_miami_bg.wasm index.html

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Playwright and dependencies
        working-directory: tests/e2e
        run: |
          bun install
          bunx playwright install --with-deps chromium

      # No continue-on-error: a failing spec fails the job. The artifacts below
      # still upload via `if: always()`.
      - name: Run E2E tests
        id: e2e
        working-directory: tests/e2e
        run: |
          mkdir -p test-results
          bunx playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            tests/e2e/test-results/
            tests/e2e/playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/test-results/*.png
          retention-days: 30
          if-no-files-found: warn

      # The PR comment reflects the real outcome of the test step (pass/fail),
      # not a count of PNG files. Skipped for PRs from forks (read-only token).
      - name: Comment test results on PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        with:
          script: |
            const outcome = process.env.E2E_OUTCOME; // success | failure | cancelled | skipped
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const verdict = {
              success: 'PASSED',
              failure: 'FAILED',
              cancelled: 'CANCELLED',
              skipped: 'SKIPPED (an earlier step failed)',
            }[outcome] || outcome;

            let body = '## E2E Test Results\n\n';
            body += `**${verdict}** (\`${context.sha.slice(0, 7)}\`)\n\n`;
            body += `Screenshots and the Playwright HTML report are attached as artifacts of the [workflow run](${runUrl}).\n`;

            const prNumber = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const botComment = comments.find((c) =>
              c.user.type === 'Bot' && c.body.includes('## E2E Test Results')
            );
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
