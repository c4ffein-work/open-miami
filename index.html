<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Open Miami // Rogue Purge - a Claude bot vs rogue AI</title>
    <style>
        /* Game font: VT323 (SIL OFL), served as a file from assets/fonts/ rather
           than inlined, so this stays a small, editable HTML file. License:
           assets/fonts/VT323-OFL.txt */
        @font-face {
            font-family: 'GameFont';
            src: url('assets/fonts/VT323-Regular.ttf') format('truetype');
            font-display: block;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: monospace;
            color: #fff;
        }
        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #ff1744;
        }
        /* ?viz right-panel inspector: an iframe of the character editor / shoggoth,
           opened when a gallery item is clicked (driven from wasm via vizInspect). */
        #viz-panel {
            position: fixed;
            top: 74px;
            right: 0;
            width: 48%;
            height: calc(100% - 82px);
            border: 0;
            background: #0b0e13;
            display: none;
            z-index: 10;
            box-shadow: -3px 0 16px rgba(0,0,0,0.6);
        }
        #viz-panel.show { display: block; }
        /* full-pane mode: the LEVELS tab is the level editor, filling the space
           below the tab bar (the sprite inspector keeps the right-half layout). */
        #viz-panel.full { left: 0; width: 100%; height: calc(100% - 74px); box-shadow: none; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loading">Loading...</div>
        <canvas id="glcanvas" tabindex='1'></canvas>
    </div>
    <iframe id="viz-panel" title="asset inspector"></iframe>
    <script>
        // Bridge the wasm ?viz gallery to the inspector iframe. Defined up-front
        // (plain script) so window.vizInspect exists before the game loop calls it.
        window.vizInspect = function (kind) {
            var f = document.getElementById('viz-panel');
            var src;
            if (kind === 'shoggoth_masked')          src = './tools/shoggoth.html?phase=masked';
            else if (kind === 'shoggoth_enraged')    src = './tools/shoggoth.html?phase=enraged';
            else if (kind === 'shoggoth_v2_masked')  src = './tools/shoggoth-v2.html?phase=masked';
            else if (kind === 'shoggoth_v2_enraged') src = './tools/shoggoth-v2.html?phase=enraged';
            else if (kind === 'levels')              src = './tools/levels.html?embed=1';
            else src = './tools/editor.html?embed=1&color=' + encodeURIComponent(kind);
            if (f.getAttribute('data-src') !== src) { f.src = src; f.setAttribute('data-src', src); }
            f.classList.toggle('full', kind === 'levels');
            f.classList.add('show');
        };
        window.vizInspectHide = function () {
            document.getElementById('viz-panel').classList.remove('show');
        };
    </script>
    <script type="module">
        // Cache busting - add version timestamp
        const version = Date.now();
        console.log('Starting to load game module...');

        // ---- WebGL renderer --------------------------------------------------
        // The wasm engine owns the simulation and describes each frame as a
        // flat command stream; renderer.js owns the canvas and the GPU. It
        // exposes window.frameRender(cmds, texts), which the engine calls once
        // per frame (see src/graphics.rs). Robots render live through the
        // robot-core 3D->2D pipeline inside the renderer; text draws from a
        // VT323 glyph atlas — so the whole frame is WebGL.
        async function setupRenderer() {
            const { initRenderer } = await import(`./renderer.js?v=${version}`);
            window.frameRender = initRenderer(document.getElementById('glcanvas'));
        }

        import(`./open_miami.js?v=${version}`)
            .then(async ({ default: init, start }) => {
                console.log('Module loaded successfully, init:', typeof init, 'start:', typeof start);

                async function run() {
                    try {
                        console.log('Starting WASM initialization...');
                        // Initialize the WASM module. Pass an explicit, cache-busted
                        // wasm URL — otherwise init() derives it from import.meta.url
                        // and the browser serves a stale open_miami_bg.wasm from cache.
                        await init(`./open_miami_bg.wasm?v=${version}`);
                        console.log('WASM initialized successfully!');

                        // Ensure DOM is loaded before starting game
                        console.log('Canvas element:', document.getElementById('glcanvas'));

                        // Make sure the game font is loaded before the renderer
                        // rasterizes its first glyphs into the atlas.
                        try {
                            await document.fonts.load("16px 'GameFont'");
                            await document.fonts.ready;
                        } catch (e) { /* fall back to monospace */ }

                        // The renderer must exist before the first engine
                        // frame calls window.frameRender.
                        await setupRenderer();

                        // Start the game
                        console.log('Starting game loop...');
                        start();

                        document.getElementById('loading').style.display = 'none';
                        console.log('Game loaded successfully!');
                    } catch (error) {
                        console.error('Failed to load game:', error);
                        console.error('Error stack:', error.stack);
                        document.getElementById('loading').textContent = 'Failed to load game. Check console for details.';
                        document.getElementById('loading').style.color = '#ff0000';
                    }
                }

                // Wait for DOM to be fully loaded
                if (document.readyState === 'loading') {
                    console.log('Waiting for DOMContentLoaded...');
                    document.addEventListener('DOMContentLoaded', run);
                } else {
                    console.log('DOM already loaded, running now...');
                    run();
                }
            })
            .catch(error => {
                console.error('Failed to load module:', error);
                console.error('Error stack:', error.stack);
                document.getElementById('loading').textContent = 'Failed to load module. Check console for details.';
                document.getElementById('loading').style.color = '#ff0000';
            });
    </script>
</body>
</html>
