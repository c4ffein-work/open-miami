<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Open Miami // Rogue Purge - a Claude bot vs rogue AI</title>
    <style>
        /* Game font: VT323 (SIL OFL), served as a file from assets/fonts/ rather
           than inlined, so this stays a small, editable HTML file. License:
           assets/fonts/VT323-OFL.txt */
        @font-face {
            font-family: 'GameFont';
            src: url('assets/fonts/VT323-Regular.ttf') format('truetype');
            font-display: block;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: monospace;
            color: #fff;
        }
        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #ff1744;
        }
        /* ?viz right-panel inspector: an iframe of the character editor / shoggoth,
           opened when a gallery item is clicked (driven from wasm via vizInspect). */
        #viz-panel {
            position: fixed;
            top: 74px;
            right: 0;
            width: 48%;
            height: calc(100% - 82px);
            border: 0;
            background: #0b0e13;
            display: none;
            z-index: 10;
            box-shadow: -3px 0 16px rgba(0,0,0,0.6);
        }
        #viz-panel.show { display: block; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loading">Loading...</div>
        <canvas id="glcanvas" tabindex='1'></canvas>
    </div>
    <iframe id="viz-panel" title="asset inspector"></iframe>
    <script>
        // Bridge the wasm ?viz gallery to the inspector iframe. Defined up-front
        // (plain script) so window.vizInspect exists before the game loop calls it.
        window.vizInspect = function (kind) {
            var f = document.getElementById('viz-panel');
            var src;
            if (kind === 'shoggoth_masked')          src = './proto/shoggoth.html?phase=masked';
            else if (kind === 'shoggoth_enraged')    src = './proto/shoggoth.html?phase=enraged';
            else if (kind === 'shoggoth_v2_masked')  src = './proto/shoggoth-v2.html?phase=masked';
            else if (kind === 'shoggoth_v2_enraged') src = './proto/shoggoth-v2.html?phase=enraged';
            else src = './proto/editor.html?embed=1&color=' + encodeURIComponent(kind);
            if (f.getAttribute('data-src') !== src) { f.src = src; f.setAttribute('data-src', src); }
            f.classList.add('show');
        };
        window.vizInspectHide = function () {
            document.getElementById('viz-panel').classList.remove('show');
        };
    </script>
    <script type="module">
        // Cache busting - add version timestamp
        const version = Date.now();
        console.log('Starting to load game module...');

        // ---- Baked 3D sprite atlas -------------------------------------------
        // Pre-bake a top-down sprite for each color x pose at facingDeg=0 (we
        // rotate in JS). Keyed "coral:idle" etc. Exposed to wasm via
        // window.drawBaked, which composites onto the shared #glcanvas 2D ctx.
        const BAKE_COLORS = ['coral', 'red', 'violet', 'magenta'];
        const BAKE_POSES = ['idle', 'walk', 'shoot', 'hit'];
        const BAKE_ATLAS = {};
        let bakeReady = false;

        // Turn the bake's opaque floor background into transparency so the
        // baked robot composites cleanly over the game floor. The measured
        // background is ~(14,18,23) (sum ~55); robot pixels jump to sum >=240
        // with the darkest trim ~99, so a threshold of 90 removes only the
        // floor while keeping the whole robot.
        const KNOCKOUT_SUM = 90;
        function knockoutBackground(canvas) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            const img = ctx.getImageData(0, 0, w, h);
            const d = img.data;
            for (let i = 0; i < d.length; i += 4) {
                if (d[i] + d[i + 1] + d[i + 2] < KNOCKOUT_SUM) {
                    d[i + 3] = 0;
                }
            }
            ctx.putImageData(img, 0, 0);
        }

        async function buildBakedAtlas() {
            try {
                const { bakeSprite } = await import('./proto/robot-core.js');
                for (const color of BAKE_COLORS) {
                    for (const pose of BAKE_POSES) {
                        // pistol reads as a clear held weapon from straight above.
                        const canvas = bakeSprite({ pose, color, facingDeg: 0, size: 256, weapon: 'pistol' });
                        // The bake's final pass clears to an opaque near-black
                        // floor (~0.03,0.04,0.05). Knock that background out to
                        // transparent so only the robot composites over the game.
                        knockoutBackground(canvas);
                        BAKE_ATLAS[color + ':' + pose] = canvas;
                    }
                }
                bakeReady = true;
                console.log('Baked sprite atlas ready:', Object.keys(BAKE_ATLAS).length, 'tiles');
            } catch (e) {
                console.error('Failed to build baked atlas (falling back to primitives):', e);
            }
        }

        // Called from wasm (extern draw_baked). Draws atlas[key] centered at
        // world/screen (x,y) under the current canvas transform, rotated by
        // angle (radians). scale multiplies the atlas native px size. Returns
        // false (no-op) until the atlas is ready so the primitive draw shows.
        const _bakeCtx = () => {
            const c = document.getElementById('glcanvas');
            return c ? c.getContext('2d') : null;
        };
        window.drawBaked = function (key, x, y, angle, scale) {
            if (!bakeReady) return false;
            const img = BAKE_ATLAS[key];
            if (!img) return false;
            const ctx = _bakeCtx();
            if (!ctx) return false;
            const w = img.width * scale;
            const h = img.height * scale;
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.drawImage(img, -w / 2, -h / 2, w, h);
            ctx.restore();
            return true;
        };

        import(`./open_miami.js?v=${version}`)
            .then(async ({ default: init, start }) => {
                console.log('Module loaded successfully, init:', typeof init, 'start:', typeof start);

                async function run() {
                    try {
                        console.log('Starting WASM initialization...');
                        // Initialize the WASM module. Pass an explicit, cache-busted
                        // wasm URL — otherwise init() derives it from import.meta.url
                        // and the browser serves a stale open_miami_bg.wasm from cache.
                        await init(`./open_miami_bg.wasm?v=${version}`);
                        console.log('WASM initialized successfully!');

                        // Pre-bake the 3D sprite atlas (non-fatal if it fails).
                        await buildBakedAtlas();

                        // Ensure DOM is loaded before starting game
                        console.log('Canvas element:', document.getElementById('glcanvas'));

                        // Make sure the game font is loaded before drawing text.
                        try {
                            await document.fonts.load("16px 'GameFont'");
                            await document.fonts.ready;
                        } catch (e) { /* fall back to monospace */ }

                        // Start the game
                        console.log('Starting game loop...');
                        start();

                        document.getElementById('loading').style.display = 'none';
                        console.log('Game loaded successfully!');
                    } catch (error) {
                        console.error('Failed to load game:', error);
                        console.error('Error stack:', error.stack);
                        document.getElementById('loading').textContent = 'Failed to load game. Check console for details.';
                        document.getElementById('loading').style.color = '#ff0000';
                    }
                }

                // Wait for DOM to be fully loaded
                if (document.readyState === 'loading') {
                    console.log('Waiting for DOMContentLoaded...');
                    document.addEventListener('DOMContentLoaded', run);
                } else {
                    console.log('DOM already loaded, running now...');
                    run();
                }
            })
            .catch(error => {
                console.error('Failed to load module:', error);
                console.error('Error stack:', error.stack);
                document.getElementById('loading').textContent = 'Failed to load module. Check console for details.';
                document.getElementById('loading').style.color = '#ff0000';
            });
    </script>
</body>
</html>
