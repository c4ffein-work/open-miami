    <style>
        /* Game font: VT323 (SIL OFL), served as a file from assets/fonts/ rather
           than inlined, so this stays a small, editable HTML file. License:
           assets/fonts/VT323-OFL.txt */
        @font-face {
            font-family: 'GameFont';
            src: url('assets/fonts/VT323-Regular.ttf') format('truetype');
            font-display: block;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: monospace;
            color: #fff;
        }
        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            /* The canvas is focusable (tabindex) so it can take keyboard
               input; without this, Chrome draws its blue focus ring around
               the whole game whenever it has focus — i.e. always. */
            outline: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #ff1744;
            text-align: center;
        }
        /* The neon title, generated by tools/gen_title.py from the same
           glyph bitmaps the in-game menu draws — shows instantly, before
           any JS or wasm has loaded. */
        /* NOTE: nothing inside #loading may reference 'GameFont' — using
           the web font during the initial document load gets its fetch
           aborted, the FontFace ends in "error", and the in-game glyph
           atlas loses the font entirely (all text goes invisible). */
        #loading svg {
            width: min(72vw, 900px);
            height: auto;
            display: block;
            margin: 0 auto;
        }
        /* ?viz right-panel inspector: an iframe of tools/inspector.html (robot or
           shoggoth), opened when a gallery item is clicked (driven from wasm via
           vizInspect). */
        #viz-panel {
            position: fixed;
            top: 74px;
            right: 0;
            width: 48%;
            height: calc(100% - 82px);
            border: 0;
            background: #0b0e13;
            display: none;
            z-index: 10;
            box-shadow: -3px 0 16px rgba(0,0,0,0.6);
        }
        #viz-panel.show { display: block; }
        /* full-pane mode: the LEVELS tab's SCENARIO (web) editor fills the pane
           below the native editor's header rows (src/editor_ui.rs MAP_TOP = 150),
           so the header — incl. the button that closes it — stays reachable (the
           sprite inspector keeps the right-half layout). */
        #viz-panel.full { left: 0; width: 100%; height: calc(100% - 74px); box-shadow: none; }
        #viz-panel.full.levels { top: 150px; height: calc(100% - 150px); }
        /* ?viz PROPS page: result of a SAVE (PUT /props/props.json), shown for a
           few seconds under the header row (driven from wasm via vizSaveProps). */
        #viz-toast {
            position: fixed;
            top: 122px;
            right: 40px;
            max-width: 46%;
            padding: 8px 14px;
            font: 15px 'GameFont', monospace;
            background: #14101c;
            border: 1px solid #735a80;
            color: #fff;
            display: none;
            z-index: 11;
            white-space: pre-wrap;
        }
        #viz-toast.show { display: block; }
        #viz-toast.ok { border-color: #3ce08c; color: #9dffc9; }
        #viz-toast.bad { border-color: #ff2e5a; color: #ff9db3; }
    </style>

            var show = function (text, cls) {

                toast.className = 'show ' + cls;
                clearTimeout(toast._hide);
                toast._hide = setTimeout(function () { toast.className = ''; }, 8000);
            };
            var put = function () {
                return fetch(path, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Editor-Token': localStorage.getItem('editorToken') || '' },
                    body: json,
                });
            };
            show('SAVING ' + path.replace(/^\//, '') + '…', '');
            put().then(function (r) {
                if (r.status !== 401) return r;
                var tok = window.prompt('Editor write token (printed by serve.py at startup):', localStorage.getItem('editorToken') || '');
                if (tok == null) throw new Error('no token');
                localStorage.setItem('editorToken', tok.trim());
                return put();
            }).then(function (r) {
                return r.json().catch(function () { return {}; }).then(function (j) {
                    if (!r.ok || !j.ok) throw new Error(j.error || ('HTTP ' + r.status));
                    show('SAVED ' + j.path + ' (' + j.bytes + ' bytes) — now run: ' + next, 'ok');
                });
            }).catch(function (e) {
                show('SAVE FAILED: ' + e.message + ' — serve via `python3 serve.py`, token from .editor-token', 'bad');
            });
        }
        // Tiny settings store for wasm (the SETTINGS modal): localStorage,
        // string values, null when unset.
        window.getSetting = function (name) { try { return localStorage.getItem('om.' + name); } catch (e) { return null; } };
        window.setSetting = function (name, value) { try { localStorage.setItem('om.' + name, value); } catch (e) {} };
        // Open an external link in a new tab (called from wasm — the ABOUT
        // modal's repo URL). noopener: the new tab gets no handle back.
        window.openExternal = function (url) { window.open(url, '_blank', 'noopener'); };
        // In-game the engine draws its own pixel crosshair; it hides the OS
        // cursor over the canvas while the game screen is active (and only
        // there — menus, ?viz and the editor keep the native pointer).
        window.setCursorHidden = function (hidden) {
            document.getElementById('glcanvas').style.cursor = hidden ? 'none' : '';
        };
        // ?viz PROPS page SAVE: props/props.json (src/props.rs settings_json);
        // the generated src/props_data.rs is refreshed by `make gen-props`.
        window.vizSaveProps = function (json) { vizPutJson('props/props.json', json, 'make gen-props'); };
        // ?viz LEVELS tab (native editor, src/editor_ui.rs) SAVE: one floor,
        // levels/<file> (src/editor.rs to_json); then `make gen-levels`.
        window.vizSaveLevel = function (file, json) {
            if (!/^floor_[0-9a-z]+\.json$/.test(file)) { throw new Error('bad level file name ' + file); }
            vizPutJson('levels/' + file, json, 'make gen-levels');
        };
    </script>
    <script type="module">
        // Cache busting - add version timestamp
        const version = Date.now();
        console.log('Starting to load game module...');

        // ---- WebGL renderer --------------------------------------------------
        // The wasm engine owns the simulation and describes each frame as a
        // flat command stream; renderer.js owns the canvas and the GPU. It
        // exposes window.frameRender(cmds, texts), which the engine calls once
        // per frame (see src/graphics.rs). Robots render live through the
        // robot-core 3D->2D pipeline inside the renderer; text draws from a
        // VT323 glyph atlas — so the whole frame is WebGL.
        async function setupRenderer() {
            const { initRenderer } = await import(`./renderer.js?v=${version}`);
            window.frameRender = initRenderer(document.getElementById('glcanvas'));
        }

        import(`./open_miami.js?v=${version}`)
            .then(async ({ default: init, start }) => {
                console.log('Module loaded successfully, init:', typeof init, 'start:', typeof start);

                async function run() {
                    try {
                        console.log('Starting WASM initialization...');
                        // Initialize the WASM module. Pass an explicit, cache-busted
                        // wasm URL — otherwise init() derives it from import.meta.url
                        // and the browser serves a stale open_miami_bg.wasm from cache.
                        await init(`./open_miami_bg.wasm?v=${version}`);
                        console.log('WASM initialized successfully!');

                        // Ensure DOM is loaded before starting game
                        console.log('Canvas element:', document.getElementById('glcanvas'));

                        // Make sure the game font is loaded before the renderer
                        // rasterizes its first glyphs into the atlas.
                        try {
                            await document.fonts.load("16px 'GameFont'");
                            await document.fonts.ready;
                        } catch (e) { /* fall back to monospace */ }

                        // The renderer must exist before the first engine
                        // frame calls window.frameRender.
                        await setupRenderer();

                        // Start the game
                        console.log('Starting game loop...');
                        start();

                        document.getElementById('loading').style.display = 'none';
                        console.log('Game loaded successfully!');
                    } catch (error) {
                        console.error('Failed to load game:', error);
                        console.error('Error stack:', error.stack);
                        document.getElementById('loading').textContent = 'Failed to load game. Check console for details.';
                        document.getElementById('loading').style.color = '#ff0000';
                    }
                }

                // Wait for DOM to be fully loaded
                if (document.readyState === 'loading') {
                    console.log('Waiting for DOMContentLoaded...');
                    document.addEventListener('DOMContentLoaded', run);
                } else {
                    console.log('DOM already loaded, running now...');
                    run();
                }
            })
            .catch(error => {
                console.error('Failed to load module:', error);
                console.error('Error stack:', error.stack);
                document.getElementById('loading').textContent = 'Failed to load module. Check console for details.';
                document.getElementById('loading').style.color = '#ff0000';
            });
    </script>
</body>
